[project]
name = "grafik"
version = "2.0.0"
description = "GRAFIK Engine (local FLUX image service) and Studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "psutil>=5.9",
    "playwright>=1.40",
    "fal-client>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
