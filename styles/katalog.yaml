    light: soft daylight of an early long exposure
    line: fine photographic detail with flat colour washes on top, colours slightly outside the edges
    composition: tidy postcard view or stiff studio pose, people in period clothes
    palette: ["#d9c9a5 sepia paper", "#8fa8a0 tinted sky", "#b5716a rose tint", "#7f9a6a green tint", "#4a3a2a sepia shadow"]
