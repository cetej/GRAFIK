nove:
  # ----------------------------------------------------------------- FOTOGRAFIE
  - slug: foto-reportaz
    name: Reportážní fotografie
    kategorie: fotografie
    poradi: 10
    note: Hlavní styl pro články. Člověk ve svém prostředí, nic neinscenované.
    medium: documentary photojournalism photograph, 35mm full-frame camera with a 35mm f/2 lens, candid unposed moment, true-to-life colour
    light: natural available light only, soft directional daylight, real shadows
    line: natural micro-contrast, fine grain, real skin pores and worn materials
    composition: layered framing with foreground, subject and environment, the decisive moment, subject in the context of their surroundings
    avoid: posed studio look, HDR, smoothed skin, illustration
    signature: dostupné světlo · nic neinscenované · člověk ve svém prostředí
    ukazky: [SPOLECNY, PORTRET, A fish seller arranging her morning catch at a busy harbour market at dawn]

  - slug: foto-portret
    name: Studiový portrét
    kategorie: fotografie
    poradi: 20
    note: Lidé a osobnosti. Jedno měkké světlo a klidné pozadí.
    medium: professional studio portrait photograph, medium format camera with an 85mm lens at f/2.8, tack-sharp eyes, light natural retouching
    light: Rembrandt lighting with a soft key at 45 degrees, subtle fill, soft falloff into shadow
    line: real skin texture with pores, fabric detail, creamy background blur
    composition: head-and-shoulders or half-figure framing against a plain mottled grey-brown canvas backdrop
    avoid: outdoor scenery, flash glare, plastic skin
    signature: trojúhelník světla na tváři · ostré oči · malované plátno v pozadí
    ukazky: [PORTRET, SPOLECNY, A young woman scientist in a dark sweater looking directly at the camera]

  - slug: foto-krajina
    name: Krajina (velký formát)
    kategorie: fotografie
    poradi: 30
    note: Krajina ostrá od popředí po horizont. Geografie, cestování.
    medium: large-format landscape photograph, 4x5 view camera with a wide-angle lens at f/16, front-to-back sharpness, enormous resolved detail
    light: low golden-hour sun raking across the terrain, long soft shadows, clear air
    line: crisp natural textures of rock, grass and water, natural dynamic range
    composition: strong foreground leading into deep distance, horizon on the upper third, any figures small in the landscape
    avoid: HDR halos, oversaturated colour, lens flare
    signature: ostré popředí i dálka · nízké slunce · člověk malý v krajině
    ukazky: [SPOLECNY, A glacial river valley with snow-capped peaks at sunrise, Wind-sculpted red sandstone cliffs above a dry desert riverbed]

  - slug: foto-priroda
    name: Zvířata (teleobjektiv)
    kategorie: fotografie
    poradi: 40
    note: Divoká zvířata v přírodě, oko zvířete je ostré, pozadí se rozpouští.
    medium: wildlife photograph, full-frame camera with a 600mm f/4 super-telephoto lens at eye level with the animal, fast shutter freezing fur and feather detail
    light: soft low morning light, backlit rim on the fur
    line: hair-level sharpness on the eye, smooth creamy out-of-focus background
    composition: animal isolated from the background by shallow depth of field, rule of thirds, space in the direction of its gaze
    avoid: zoo fences, cartoon look, oversharpening
    signature: výška očí zvířete · měkké rozostřené pozadí · kontra na srsti
    ukazky: [A red fox in frosted grass looking over its shoulder, SPOLECNY, A snow leopard resting on a rocky ledge in light snowfall]

  - slug: foto-makro
    name: Makrofotografie
    kategorie: fotografie
    poradi: 45
    note: Hmyz, rostliny a materiály zblízka.
    medium: extreme macro photograph, 100mm macro lens at 2x magnification with focus stacking, microscopic surface detail
    light: soft diffused ring flash with gentle specular highlights
    line: razor-thin plane of focus falling off to smooth bokeh, visible scales, hairs and water droplets
    composition: subject filling the frame against a smooth dark or natural out-of-focus background
    avoid: wide scenery, illustration, oversaturation
    signature: detail zblízka · úzká rovina ostrosti · kapky a chloupky
    ukazky: [A jumping spider on a dew-covered green leaf, The scales of a butterfly wing in orange and black, A honeybee covered in pollen on a flower]

  - slug: foto-cernobila
    name: Černobílá klasika
    kategorie: fotografie
    poradi: 50
    note: Humanistická černobílá fotografie z ulice, zrno a hutná černá.
    medium: classic black-and-white documentary photograph, 35mm rangefinder camera, high-speed film pushed one stop, silver gelatin print
    light: available street light with deep shadows and bright highlights
    line: visible film grain, rich tonal range from true black to paper white
    composition: humanist street photography, geometric framing, the decisive moment
    palette: ["#111111 true black", "#6f6f6f silver grey", "#f2f0ea paper white"]
    avoid: any colour, sepia, digital noise
    signature: viditelné zrno · skutečná černá i bílá · rozhodující okamžik
    ukazky: [SPOLECNY, PORTRET, Two children running through a rainy old city arcade in the 1950s]

  - slug: foto-kodachrome
    name: Diapozitiv (60. léta)
    kategorie: fotografie
    poradi: 60
    note: Barevný diapozitiv z rodinného alba nebo časopisu 60. let.
    medium: 1960s colour slide photograph, Kodachrome transparency film, the picture fills the frame with no slide mount
    light: bright midday sun with hard shadows
    line: fine grain, slightly soft lens, gentle vignetting, slide-film contrast
    composition: classic snapshot framing in a period setting, straight horizon
    palette: ["#b3261e deep red", "#e3b23c yellow", "#4f8fa8 teal sky", "#d9a77f warm skin", "#2a2a2a dense black"]
    avoid: modern objects, teal-and-orange digital grading
    signature: sytá červená a žlutá · hutné stíny · dobový amatérský záběr
    ukazky: [SPOLECNY, PORTRET, A family having a picnic beside a 1960s car in the countryside]

  - slug: foto-kolodium
    name: Kolodiová fotografie (19. století)
    kategorie: fotografie
    poradi: 70
    note: Nejstarší fotografie, kolem 1860. Strnulé pózy, stříbrné tóny, chemické skvrny.
    medium: mid-19th-century wet-plate collodion tintype photograph, antique brass portrait lens, long exposure
    light: flat north skylight from a glass-roofed studio
    line: silvery metallic tones, swirling blur at the edges, chemical flow marks, scratches and dark pitted borders
    composition: stiff frontal pose, static subject, central composition, skies rendered pale white
    palette: ["#16130f near black", "#5b5a55 pewter", "#c7c3b6 tarnished silver"]
    avoid: modern clothing, colour, smiling
    signature: stříbrný kov · skvrny a tmavé okraje · strnulá póza
    ukazky: [PORTRET, SPOLECNY, A stern 19th-century blacksmith standing in front of his forge]

  - slug: foto-muzejni
    name: Muzejní snímek předmětu
    kategorie: fotografie
    poradi: 80
    note: Artefakty a předměty jako v katalogu muzea, věrné barvy a materiál.
    medium: museum catalogue object photograph, medium format camera with focus stacking, the entire object in sharp focus, accurate colours
    light: soft even cross-polarised light, no glare, only a faint contact shadow
    line: true material textures, patina, tool marks, surface wear
    composition: single object centred on a seamless neutral grey background, three-quarter view, generous margins
    avoid: hands, museum labels, display case, dramatic light
    signature: jeden předmět · neutrální šedá plocha · patina a stopy nástrojů
    ukazky: [An ancient Greek bronze Corinthian helmet with green patina, A Roman glass flask with iridescent weathering, A carved medieval wooden chest with iron fittings]

  - slug: foto-letecka
    name: Letecký snímek
    kategorie: fotografie
    poradi: 90
    note: Krajina a města shora, reliéf ve stínech, vzory v krajině.
    medium: aerial photograph taken from a small aircraft, oblique or straight-down view, long lens compressing the terrain
    light: low side sun revealing relief in long shadows
    line: crisp geometric patterns of land, roads and water, faint atmospheric haze
    composition: no horizon or a high horizon, pattern-like abstract framing
    avoid: map labels, game graphics, fisheye distortion
    signature: pohled shora · dlouhé stíny · krajina jako vzor
    ukazky: [A river delta branching through green farmland, Terraced rice fields around a small village, A medieval walled town surrounded by fields]

  - slug: foto-sem
    name: Elektronový mikroskop (SEM)
    kategorie: fotografie
    poradi: 95
    note: "Věda: pyly, hmyz, krystaly pod elektronovým mikroskopem."
    medium: scanning electron microscope micrograph, greyscale image with subtle false colour, extreme depth of field
    light: electron-beam edge glow, bright edges and dark hollows, no ordinary cast shadows
    line: ultra-fine surface texture, sharp microstructure, slight charging noise
    composition: subject floating against a black or dark grey background, filling the frame
    avoid: scale bars, measurement labels, optical bokeh, cartoon look
    signature: svítící hrany · tmavé pozadí · hloubka ostrosti přes celý objekt
    ukazky: [A pollen grain with a spiky surface, The compound eye of a fly, A snowflake-like cluster of salt crystals]

  # ----------------------------------------------------------------- HISTORICKÉ (chronologicky, pravěk až klasicismus)
  - slug: hist-jeskynni-malba
    name: Jeskynní malba
    kategorie: historicke
    poradi: 110
    note: Pravěk, 30 000 až 10 000 př. n. l. (Lascaux, Altamira, Chauvet).
    medium: Upper Palaeolithic cave painting in the manner of Lascaux and Altamira, red and yellow ochre, manganese black and charcoal blown and smeared by hand on rough limestone
    light: warm uneven glow on the rock wall falling off into darkness at the edges
    line: thick confident contour lines, sprayed pigment, natural bumps and cracks of the rock showing through
    composition: animals and simple stick-like human figures in profile overlapping freely on the rock face, no ground line, no perspective
    palette: ["#c9b594 limestone", "#9c3d1f red ochre", "#c98f3a yellow ochre", "#1f1a17 manganese black"]
    avoid: realistic anatomy, framed picture, modern objects
    signature: drsná skála prosvítá · okr a dřevěné uhlí · zvířata bez základní linky
    ukazky: [SPOLECNY, A group of hunters with spears surrounding a mammoth, A herd of bison and running horses with red hand stencils]

  - slug: hist-egypt
    name: Egyptská nástěnná malba
    kategorie: historicke
    poradi: 120
    note: Nová říše, 1500 až 1100 př. n. l. (hrobky v Thébách). Vhodné i pro schémata v registrech.
    medium: ancient Egyptian New Kingdom tomb wall painting, mineral pigments on smooth white plaster
    light: flat, shadowless, evenly lit picture plane
    line: crisp black outlines around flat areas of colour, no shading, slight flaking of the plaster
    composition: horizontal registers with a ground line, figures with head and legs in profile and shoulders frontal, hierarchical scale, no perspective
    palette: ["#efe6d2 white plaster", "#c9a03a ochre", "#2e6f95 egyptian blue", "#4f8a6b malachite green", "#a8432c red earth", "#1b1a18 carbon black"]
    avoid: perspective, cast shadows, three-quarter faces
    signature: hlava z profilu a ramena zepředu · vodorovné registry · ploché barvy bez stínu
    ukazky: [SPOLECNY, A noblewoman in a white linen dress and a broad collar with her head in profile, Workers harvesting wheat along the Nile with a seated official watching]

  - slug: hist-recka-vaza
    name: Řecká vázová malba
    kategorie: historicke
    poradi: 130
    note: Athény, 6. až 5. stol. př. n. l. Červenofigurová technika.
    medium: ancient Greek red-figure vase painting, close view of the painted surface of an Attic amphora, terracotta-orange figures reserved against a glossy black slip ground
    light: soft museum light with a faint sheen on the glossy slip
    line: fine relief lines in black slip, sparse anatomical detail, Greek key meander bands
    composition: figures in strict profile in a frieze, meander border above and below
    palette: ["#c46a2c terracotta orange", "#15120f glossy black", "#e9e0cc cream white"]
    avoid: full colour, shading, realistic landscape
    signature: oranžové postavy na černé · přísný profil · meandr
    ukazky: [SPOLECNY, A bearded philosopher holding a staff in profile, Two warriors fighting with spears and round shields]

  - slug: hist-pompeje
    name: Římská nástěnná malba (Pompeje)
    kategorie: historicke
    poradi: 140
    note: 1. stol. n. l., Pompeje a Herculaneum. Pompejská červeň, rychlý štětec, otlučená omítka.
    medium: Roman fresco wall painting from Pompeii, pigment on lime plaster, quick impressionistic brushwork
    light: soft modelling from one side with painted highlights
    line: loose quick strokes, weathered cracked plaster with missing patches
    composition: figures inside a painted illusionistic architectural frame against Pompeian red panels, shallow stage-like space
    palette: ["#8f2a1e pompeian red", "#c79a4b ochre", "#2c2a26 black", "#5f7a5a green earth", "#e6dcc6 cream plaster"]
    avoid: glossy varnish, smooth digital gradients
    signature: pompejská červeň · popraskaná omítka · malovaná architektura kolem
    ukazky: [SPOLECNY, Portrait of a young woman holding a stylus and wax tablets, A banquet with reclining guests and a servant pouring wine]

  - slug: hist-mozaika
    name: Římská a byzantská mozaika
    kategorie: historicke
    poradi: 150
    note: 2. až 6. stol. (Ravenna, Piazza Armerina). Kamínky místo tahů štětce.
    medium: Roman and early Byzantine mosaic made of small square stone and glass tesserae set in mortar
    light: even light with small glints on the glass tesserae
    line: visible grid of individual tesserae following the contours, dark outlines, no smooth gradients
    composition: central emblem with a guilloche or wave-pattern border
    palette: ["#e8dfca limestone cream", "#a8432c red tile", "#c9a03a gold", "#35605f teal glass", "#22201d black"]
    avoid: painted brushstrokes, photorealism
    signature: jednotlivé kamínky · malta mezi nimi · pletencový okraj
    ukazky: [SPOLECNY, PORTRET, Dolphins and fish in a stylised sea]

  - slug: hist-ikona
    name: Byzantská ikona
    kategorie: historicke
    poradi: 160
    note: Byzanc a pravoslavný okruh, 6. až 15. stol. Zlaté pozadí, tvář zepředu.
    medium: Byzantine icon painting in egg tempera on a gessoed wooden panel with burnished gold leaf background
    light: no natural light source, modelling by stacked highlights on the face and robes
    line: flat elongated forms, dark contours, stylised drapery, fine craquelure and aged varnish
    composition: frontal symmetrical figure with a golden halo, inverse perspective, no landscape depth
    palette: ["#c8a24a gold leaf", "#6e1f1a oxblood", "#1f3a5f deep blue", "#7a5a3a olive flesh", "#1c1815 dark umber"]
    avoid: realistic perspective, soft photographic light, lettering
    signature: zlaté pozadí · svatozář · tvář zepředu s vrstvenými světly
    ukazky: [PORTRET, SPOLECNY, A saint holding a closed book seen from the front]

  - slug: hist-rukopis
    name: Iluminovaný rukopis
    kategorie: historicke
    poradi: 170
    note: Románské a gotické období, 12. až 15. stol. Malá scéna v rámu na pergamenu.
    medium: medieval illuminated manuscript miniature, tempera and shell gold on vellum, framed by an ornate foliated border
    light: no cast shadows, flat colours with white highlights
    line: fine pen outline, burnished gold, delicate ivy-leaf border
    composition: small scene in a rectangular or quatrefoil frame, stacked space, patterned diaper background
    palette: ["#ede3cc vellum", "#2b4b8c ultramarine", "#b23a24 vermilion", "#c8a24a shell gold", "#3e6b4e verdigris"]
    avoid: script, writing, realistic perspective
    signature: pergamen · listové úponky v rámu · zlacené pozadí se vzorem
    ukazky: [SPOLECNY, PORTRET, Knights besieging a castle with ladders and a trebuchet]

  - slug: hist-vitraz
    name: Gotická vitráž
    kategorie: historicke
    poradi: 175
    note: 12. až 15. stol. Barevné sklo, olověné pásky, světlo zezadu.
    medium: Gothic stained glass window, the entire image including every figure, tree and the ground is assembled from flat pieces of hand-blown coloured glass joined by black lead cames, faces and folds painted in dark vitreous enamel
    light: strong daylight shining through the glass from behind, glowing saturated colour
    line: thick black lead lines cutting all forms into small flat glass segments, slightly uneven glass surface
    composition: simplified flat figures inside a pointed lancet arch, geometric mosaic border, no depth
    palette: ["#1d3f8f cobalt", "#a01c2c ruby", "#2c7a4f emerald", "#d9a02e amber", "#0f0f0f lead black"]
    avoid: realistic painted scene behind the frame, smooth gradients, perspective, lettering
    signature: světlo prochází sklem · olověné pásky · lomený oblouk
    ukazky: [SPOLECNY, PORTRET, A rose window with radiating petals and small scenes]

  - slug: hist-gotika
    name: Gotická desková malba
    kategorie: historicke
    poradi: 180
    note: Mezinárodní gotika, 14. až 15. stol. (Mistr Theodorik, Mistr třeboňského oltáře).
    medium: Gothic panel painting in egg tempera on wood with a tooled gold-leaf sky, late 14th-century Bohemian and International Gothic manner
    light: soft idealised light with no cast shadows, fine hatching to model forms
    line: elegant swaying figures, soft folds, delicately incised gold ornament
    composition: shallow stage with small symbolic rocks and trees, figures scaled by importance
    palette: ["#c8a24a tooled gold", "#7f1d1d deep red", "#2f5d62 blue-green", "#ece2cd ivory", "#2b211a dark umber"]
    avoid: linear perspective, oil paint impasto, realistic landscape
    signature: zlacené nebe · ladně prohnuté postavy · malý symbolický terén
    ukazky: [SPOLECNY, PORTRET, A queen and her attendants in a walled garden]

  - slug: hist-cina-tus
    name: Čínská tušová malba
    kategorie: historicke
    poradi: 190
    note: Dynastie Song a Yuan, 10. až 14. stol. Hory v mlze, velká prázdná plocha.
    medium: Song dynasty Chinese ink wash painting, black ink in graded washes and dry brush on aged silk
    light: misty atmospheric depth, no cast shadows
    line: sparse expressive calligraphic brush strokes, wet ink bleeding into silk, no pen hatching
    composition: vertical hanging-scroll arrangement with vast empty space, mountains fading into mist, tiny figures
    palette: ["#1a1a1a ink black", "#7c7a72 ink grey", "#d8cdb2 aged silk"]
    avoid: calligraphy, seal stamps, saturated colour
    signature: hory mizí v mlze · velká prázdná plocha · maličké postavy
    ukazky: [SPOLECNY, A scholar sitting under a gnarled pine tree, A fisherman in a small boat below towering misty mountains]

  - slug: hist-quattrocento
    name: Raná renesance (quattrocento)
    kategorie: historicke
    poradi: 200
    note: Itálie, 15. stol. (Piero della Francesca, Botticelli). Klid, geometrie, světlé barvy.
    medium: early Italian Renaissance tempera painting on panel in the manner of Piero della Francesca and Botticelli
    light: clear even daylight with pale shadows
    line: precise contours, calm sculptural figures, pale matte colours
    composition: measured one-point perspective, geometric architecture, landscape receding in pale blue
    palette: ["#e6d9bf pale stone", "#8fa6b5 pale blue", "#b5654a soft vermilion", "#6e7f5a sage green", "#d3b483 flesh ochre"]
    avoid: dark tenebrist shadows, impasto, modern objects
    signature: čistá perspektiva · světlé matné barvy · klidné postavy
    ukazky: [SPOLECNY, Strict profile portrait of a noblewoman with pearls in her hair, An ideal Renaissance piazza with a round temple and small figures]

  - slug: hist-severni-renesance
    name: Severní renesance
    kategorie: historicke
    poradi: 210
    note: Nizozemí a Německo, 15. až 16. stol. (van Eyck, Holbein). Olej, mikroskopický detail.
    medium: Northern Renaissance oil painting on oak panel in the manner of Jan van Eyck and Hans Holbein, transparent oil glazes
    light: cool window light from the left, jewel-like clarity
    line: microscopic detail of fabric, fur and metal reflections, no visible brushstrokes
    composition: intimate interior or a panoramic distant landscape through a window, every object sharply described
    palette: ["#1f3b2d deep green", "#7a1f1f crimson", "#2a2a33 black velvet", "#c9a15a brass", "#d8bfa3 flesh"]
    avoid: loose brushwork, soft focus
    signature: detail kožešiny a kovu · sklovité vrstvy · okno do dálky
    ukazky: [SPOLECNY, PORTRET, A merchant's room with a convex mirror and a brass chandelier]

  - slug: hist-drevoryt
    name: Renesanční dřevoryt
    kategorie: historicke
    poradi: 220
    note: Německo kolem 1500 (Dürer, Cranach, Schedelova kronika). Grafika, čistě černá a bílá.
    medium: black ink woodcut print from a carved pear-wood block on laid paper, about 1500, in the manner of Albrecht Durer
    light: no light source, modelling only by parallel hatching
    line: bold black lines with swelling and tapering hatch strokes, curling clouds, pure black and white
    composition: densely filled image with a landscape ground and figures in front
    palette: ["#14120f printer's black", "#e7dfca laid paper"]
    avoid: grey tones, wash, colour, signature monogram
    signature: čistá černá na papíře · šrafy se ztenčují · vinuté mraky
    ukazky: [SPOLECNY, PORTRET, A walled town under an ominous comet in the sky]

  - slug: hist-persie
    name: Perská miniatura
    kategorie: historicke
    poradi: 230
    note: Safíovský Írán, 16. stol. (Behzád, Šáhnáme). Pohled shora, tyrkys a zlato.
