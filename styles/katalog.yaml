# Katalog stylů podle kategorií (DECISIONS 2026-10-31). Zdroj: scripts/styles_katalog.py ho zapíše do KNIHOVNY.
# Karty, které v knihovně už jsou, se nepřepisují. KNIHOVNA nemá zálohu, proto je tenhle text v gitu.
#
# Do promptu jdou anglická pole (medium, light, line, composition, look, lens, grade, avoid, palette) a musí
# zůstat bez diakritiky, jinak by je Engine překládal za peníze. Česky jsou jen name, note a signature.
# Mrtví staří mistři smějí jmenovat techniku; živé autory a chráněné značky nikdy, styl se popisuje slovy.
#
# ukazky: zadání ukázek v pořadí, první je náhled v knihovně. SPOLECNY a PORTRET jsou společná zadání
# (viz scripts/styles_katalog.py), díky nim jde styly porovnat na stejném motivu.

# Karty, které už v knihovně jsou: doplní se jen tato pole, zbytek karty zůstává (i pro KLAPKU).
